<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification SwipSales</title>
<meta name="description" content="Certification SwipSales — profil commercial évalué.">
<meta property="og:title" content="Certifié SwipSales">
<meta property="og:description" content="Profil commercial évalué et certifié par SwipSales.">
<meta property="og:type" content="profile">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="design-system/components.css">
<link rel="stylesheet" href="design-system/access.css">
</head>
<body>
<div class="card">
  <div class="logo">Swip<span>Sales</span></div>
  <div id="content">
    <p class="err">Chargement…</p>
  </div>
</div>
<script>
const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:3000/api'
  : 'https://salesforge-recruitment-production.up.railway.app/api';

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  const el = document.getElementById('content');
  if (!id) { el.innerHTML = '<p class="err">Lien de certification invalide.</p>'; return; }
  try {
    const r = await fetch(API + '/candidats/' + encodeURIComponent(id) + '/certificat-public');
    if (!r.ok) throw new Error('not found');
    const d = await r.json();
    el.innerHTML = `
      <span class="eyebrow">Certification SwipSales</span>
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 1l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 14.9 6.8 17.1l1-5.8L3.5 7.2l5.9-.9z"/></svg></div>
      <h1>${escapeHtml(d.prenom)} est certifié·e SwipSales</h1>
      <p class="score">Score ADN commercial : <b>${d.score} / 100</b></p>
      <a class="btn bp" href="swipsales_landing.html">Découvrir SwipSales</a>
    `;
  } catch (e) {
    el.innerHTML = '<p class="err">Certificat introuvable ou partage désactivé.</p>';
  }
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
load();
</script>
</body>
</html>
